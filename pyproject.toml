[build-system]
requires = ["setuptools >= 83.0.0", "wheel >= 0.47.0", "requests ~= 2.34.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sharly-chess"
description = "An application to help chess arbiters and organizers manage their tournaments"
requires-python = ">=3.13.0"
version = "5.1.0"

authors = [
  { name = "Pascal Aubry", email = "support@sharly-chess.com" },
  { name = "Sammy Plat", email = "support@sharly-chess.com" },
  { name = "Timothy Armes", email = "support@sharly-chess.com" },
  { name = "Youri Aubry", email = "support@sharly-chess.com" },
]
license = { text = "AGPL v3.0" }
readme = "README.md"
dependencies = [
  "advancedhtmlparser ~= 9.0.2",
  "aiosqlite ~= 0.22.1",
  "aiosqlitepool ~= 1.0.0",
  "apluggy ~= 1.1.2",
  # Latest compatible version should always be preferred due to security reasons
  # This can be pinned later due to security concerns
  "argon2-cffi",
  "babel ~= 2.18.0",
  "chardet ~= 7.4.3",
  "chess ~= 1.11.2",
  "colorama ~= 0.4.6",
  "colorlog ~= 6.10.1",
  "cryptography ~= 49.0.0",
  "fonttools ~= 4.63.0",
  "httpdate ~= 1.2.0",
  "iso4217parse ~= 0.6.2",
  "jinja2 ~= 3.1.6",
  "litestar ~= 2.24.0",
  "markdown-it-py ~= 4.2.0",
  "packaging ~= 26.2",
  "paramiko >= 5.0.0",
  "pathvalidate ~= 3.3.1",
  "pefile == 2024.8.26",
  "pluggy ~= 1.6.0",
  "psutil ~= 7.2.2",
  "pycountry ~= 26.2.16",
  "pyexcel-ods3 ~= 0.6.1",
  "python-dotenv ~= 1.2.2",
  "python-tds ~= 1.17.1",
  "qrcode[pil] ~= 8.2",
  "requests ~= 2.34.2",
  "rubicon-objc ~= 0.5.6",
  "sniffio ~= 1.3.1",
  "openpyxl ~= 3.1.5",
  "text_unidecode ~= 1.3",
  "toga == 0.5.2",
  "toml ~= 0.10.2",
  "uvicorn ~= 0.51.0",
  "validators ~= 0.35.0",
  "wsproto ~= 1.3.2",
  "xlrd ~= 2.0.2",
  "xlsxwriter ~= 3.2.9",
]

[project.optional-dependencies]
lint = [
  "djlint ~= 1.46.2",
  "mypy >= 2.3.0",
  "pipdeptree",
  "pre-commit",
  "ruff ~= 0.15.21",
  "validate-pyproject",
  # Stubs for the dependencies typeshed carries. Without them mypy knows
  # nothing about these APIs and checks none of the calls into them.
  "types-colorama",
  "types-openpyxl",
  "types-paramiko",
  "types-psutil",
  "types-pyyaml",
  "types-pyinstaller",
  "types-qrcode",
  "types-toml",
  "types-xlrd",
]

translate = [
  "transformers",
  "torch",
  "sentencepiece",
  "sacremoses",
]

export = [
  "pyinstaller-versionfile ~= 3.1.0",
  "pyinstaller ~= 6.21.0",
  "pip-licenses ~= 5.5.5",
  "dmgbuild ~= 1.6",
]

tests = [
  "pytest",
  "pytest-cov",
  "pytest-playwright",
  "pytest-asyncio",
  "pytest-base-url",
  "pytest-xdist",
]

scripts = [
  "scour ~= 0.38.2",
]

[tool.setuptools.package-data]
"data.pairings" = [
  "resources/*.mrec",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "A",      # shadowed builtins
  "ARG",    # unused arguments
  "ASYNC",  # blocking calls in async functions
  "B",      # likely bugs (bugbear)
  "C4",     # comprehensions
  "E4", "E7", "E9", "F",  # pycodestyle errors and pyflakes
  "ISC",    # implicit string concatenation
  "LOG",    # logging misuse
  "PERF",   # avoidable overhead
  "PIE",    # miscellaneous lints
  "PLE", "PLW",  # pylint errors and warnings
  "PTH",    # os.path calls with a pathlib equivalent
  "RET",    # return statements
  "RUF",    # ruff-specific lints
  "SIM",    # simplifications
  "TID",    # tidy imports
  "UP",     # syntax available on the minimum Python version
]

# Not selected: `DTZ` (timezone-naive datetimes). Timestamps are stored as UTC
# ISO text and converted to local naive datetimes on the way in, by the four
# functions on `SQLiteDatabase` that are the only aware datetimes in the tree.
# In memory everything is local naive, which is what `datetime.now()` returns,
# and a tournament's dates are `date` objects that carry no zone at all. Making
# the calls aware would raise on every comparison with a value read back from
# the database, to restate at 123 call sites what the boundary already handles.

ignore = [
  # Parameters named after builtins (`id`, `type`, `filter`) are part of the
  # public shape of entities, stores and hooks.
  "A002",
  # Arguments a signature has to accept to conform to its base class.
  "ARG002", "ARG003", "ARG004",
  # And what a caller dictates: shutil's onerror, a signal handler, a Toga
  # on_press, a key function — each has to take what it is handed.
  "ARG001", "ARG005",
  # Same for a method named after one (`Option.type` is the option's own type)
  # and for an import that carries a library's name (`requests`' ConnectionError,
  # `webbrowser.open`).
  "A003", "A004",
  # Accented and typographic characters are expected in translatable strings.
  "RUF001", "RUF002", "RUF003",
  # Normalising the item in place — strip it, parse it, swap the pair — is what
  # a loop variable is reassigned for.
  "PLW2901",
  # An optional hook declares a no-op default on purpose; making it abstract
  # would force every subclass to restate it.
  "B027",
  # Module-level singletons and lazy caches are built with `global`: the logger,
  # the plugin manager, the experimental-features flag.
  "PLW0603",
  # `open()` reads better than `Path.open()` at the call sites that use it.
  "PTH123",
  # The nine handles left outlive their scope on purpose: a
  # `NamedTemporaryFile(delete=False)` whose path is what the caller wants, and
  # the devnull that stdout and stderr are pointed at for the life of the
  # process. A context manager would close the file the caller is about to read.
  "SIM115",
]

[tool.ruff.lint.per-file-ignores]
# One-off generators for the Molter appendix. Every helper they define inside a
# loop is called in the same iteration, which `B023` cannot tell apart from a
# closure that outlives it.
"docs/technical-appendices/molter/*" = ["B023"]

[tool.djlint]
profile = "jinja"
extension = "html"
# Templates live beside the code that renders them, in the core and in
# each plugin, so the tree to lint is `src`.
#
# Ignored:
# - H021, inline styles: print layouts and htmx fragments size themselves
#   in place, and a stylesheet rule per one-off measure would say less.
# - T002, quotes inside a tag: the templates use single quotes, as the
#   Python around them does.
# - H043, `<button>` without a type: left for a pass of its own.
# - H036 and H020, `<br>` for spacing and an empty tag pair: a dot drawn
#   by CSS, a blank cell in a printed grid.
# - H005, H007, H016, H030, H031, the document-level rules (`lang`,
#   doctype, title, meta description): most templates are fragments
#   swapped into a page, and the print documents have no description.
ignore = "H021,T002,H043,H036,H020,H005,H007,H016,H030,H031"

[tool.coverage.run]
source = ["src"]
# The end-to-end suite drives the web layer through a server in a child
# process, which measures nothing unless each process writes its own data
# file and the run combines them afterwards.
parallel = true
# That server is signalled, not asked to exit, and it holds the screens'
# event streams open: without a handler that flushes on SIGTERM its data
# never reaches disk.
sigterm = true
# The GUI only runs under Toga, and the migrations only against a database of
# the version they migrate, so neither is reachable from the suite. The
# updaters are driven by the GUI alone, and each one only on the platform it
# updates.
omit = [
  "src/gui/*",
  "src/database/sqlite/*/migrations/*",
  "src/common/updaters/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
# A floor, not a target: it exists so a change cannot quietly take coverage
# down with it. Raise it when the figure rises, never lower it to pass.
fail_under = 68

[tool.mypy]
mypy_path = "src:."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
# A `cast` to the type a value already has says nothing.
warn_redundant_casts = true
# `==` and `is` between types that can never be the same are a comparison
# that always fails, not a check.
strict_equality = true
# A name imported into a package is not the package's unless `__all__`
# says so; the rest is imported from where it is defined.
no_implicit_reexport = true
extra_checks = true
enable_error_code = [
  # A name read on a path that never assigned it.
  "possibly-undefined",
  # An awaitable whose result is dropped, so the call never runs.
  "unused-awaitable",
  # Truth-testing something that cannot be empty.
  "truthy-iterable",
  # A standard-library call the runtime is due to take away.
  "deprecated",
  # A bare `# type: ignore` silences whatever else lands on that line later.
  "ignore-without-code",
]

[[tool.mypy.overrides]]
# These ship neither stubs nor a `py.typed` marker, and typeshed carries none
# for them, so there is nothing to install and nothing to check. Named one by
# one rather than silenced as a family: a dependency added without types
# should be a decision, not a default.
module = [
  "AdvancedHTMLParser.*",
  "aiosqlitepool.*",
  "apluggy.*",
  "fontTools.*",
  "pyexcel_ods3.*",
  "pytds.*",
  "rubicon.objc.*",
  "text_unidecode.*",
  "toga_cocoa.*",
  "toga_gtk.*",
  "travertino.*",
  "xlsxwriter.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Code behind a `sys.platform` test is unreachable, and so unchecked, on every
# other platform, which makes the ignores it needs look unused there.
module = [
  "utils.scripts",
  "sharly_chess",
  "common.updaters.windows_updater",
  "gui.server_gui_toga",
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Every package under `src` is annotated, and kept that way. `tests` and
# `scripts` are not, which is why this is a per-module setting.
module = [
  "utils.*",
  "common.*",
  "web.*",
  "gui.*",
  "plugins.*",
  "database.*",
  "data.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
# A test narrows a property with an assert, reads it again expecting the new
# value, and compares fixtures by identity: all three look like dead code to
# mypy and are not. Same reason the annotation rules above stop at `src`.
warn_unreachable = true

[[tool.mypy.overrides]]
# Last, so it wins over the block above. Same reason as the unused ignores:
# the branch that serves another platform is dead on the one running mypy,
# and saying so on every line only reports which machine the check ran on.
module = [
  "utils.scripts",
  "utils.fonts",
  "common.network",
  "common.updaters.version_updater",
  "gui.server_gui_toga",
  "gui.web_view_background",
]
warn_unreachable = false

[tool.mutmut]
# Mutation testing, run by hand on the pure logic: `mutmut run`, then
# `mutmut browse`. Each surviving mutant is a change the tests let through.
source_paths = ["src/data/tie_breaks/", "src/data/pairings/"]
do_not_mutate = ["src/data/pairings/engines.py", "src/data/pairings/managers.py"]
also_copy = ["conftest.py", "pytest.ini", "src/", "locale/", "examples/", "default-files/", "docs/", "tools/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# One process: the trampolines that record which test reaches which
# function live in the process running the tests.
# The hook-name test reads the source, which here is the mutated copy.
pytest_add_cli_args = [
  "-n", "0", "-p", "no:cacheprovider", "-q",
  "--deselect", "tests/unit/test_plugin_hook_contract.py::test_every_hook_the_source_names_is_declared",
]
