[build-system]
requires = ["setuptools >= 83.0.0", "wheel >= 0.47.0", "requests ~= 2.34.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sharly-chess"
description = "An application to help chess arbiters and organizers manage their tournaments"
requires-python = ">=3.13.0"
version = "5.0.0a2"

authors = [
  { name = "Pascal Aubry", email = "support@sharly-chess.com" },
  { name = "Sammy Plat", email = "support@sharly-chess.com" },
  { name = "Timothy Armes", email = "support@sharly-chess.com" },
  { name = "Youri Aubry", email = "support@sharly-chess.com" },
]
license = { text = "AGPL v3.0" }
readme = "README.md"
dependencies = [
  "AdvancedHTMLParser ~= 9.0.2",
  "aiosqlite ~= 0.22.1",
  "aiosqlitepool ~= 1.0.0",
  "XlsxWriter ~= 3.2.9",
  "apluggy ~= 1.1.2",
  # Latest compatible version should always be preferred due to security reasons
  # This can be pinned later due to security concerns
  "argon2-cffi",
  "babel ~= 2.18.0",
  "chardet ~= 7.4.3",
  "chess ~= 1.11.2",
  "colorama ~= 0.4.6",
  "colorlog ~= 6.10.1",
  "cryptography ~= 49.0.0",
  "httpdate ~= 1.2.0",
  "iso4217parse ~= 0.6.2",
  "Jinja2 ~= 3.1.6",
  "litestar ~= 2.24.0",
  "packaging ~= 26.2",
  "pathvalidate ~= 3.3.1",
  "pefile == 2024.8.26",
  "pluggy ~= 1.6.0",
  "psutil ~= 7.2.2",
  "pycountry ~= 26.2.16",
  "pyexcel-ods3 ~= 0.6.1",
  "python-tds ~= 1.17.1",
  "python-dotenv ~= 1.2.2",
  "qrcode[pil] ~= 8.2",
  "requests ~= 2.34.2",
  "rubicon-objc ~= 0.5.6",
  "sniffio ~= 1.3.1",
  "text_unidecode ~= 1.3",
  "toml ~= 0.10.2",
  "uvicorn ~= 0.51.0",
  "validators ~= 0.35.0",
  "toga == 0.5.2",
  "wsproto ~= 1.3.2",
]

[project.optional-dependencies]
lint = [
  "ruff ~= 0.15.21",
  "validate-pyproject",
  "pipdeptree",
  "mypy >= 2.2.0",
  "pre-commit",
]

translate = ["transformers", "torch", "sentencepiece", "sacremoses"]

export = ["PyInstaller ~= 6.21.0", "pip-licenses", "dmgbuild ~= 1.6"]

tests = ["pytest", "pytest-playwright", "pytest-asyncio", "pytest-base-url"]

scripts = ["scour ~= 0.38.2"]

[tool.setuptools.package-data]
"data.pairings" = ["resources/*.mrec"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
check_untyped_defs = true
disable_error_code = ["import-untyped", "no-redef"]
