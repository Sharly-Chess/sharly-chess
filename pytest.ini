[pytest]
# pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Markers
markers =
    release_only: marks tests as to be run on new release (deselect with '-m "not release_only"')
    e2e: marks tests as end-to-end tests
    unit: marks tests as unit tests
    benchmark: marks tests that measure rather than assert (deselect with '-m "not benchmark"')

# Test output
addopts =
    --strict-markers
    --strict-config
    --verbose
    -ra
    --tb=short
    # Four workers, each with a server and a browser of its own; more
    # buys little, and each worker only adds to the fixed start-up.
    -n 4
    # Release-only tests are left out by default; a release runs them with
    # -m "" (no filter), and any -m on the command line overrides this one.
    # Benchmarks are left out for the same reason and a further one: they
    # report numbers rather than pass or fail, and timing assertions on a
    # shared runner would flake until nobody read them.
    -m "not release_only and not benchmark"

# Minimum version
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
