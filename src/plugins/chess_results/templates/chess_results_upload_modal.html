{% import '/common/macros.j2' as macros with context %}
{% import '/admin/common/macros.j2' as admin_macros with context %}

<div
    class="modal-dialog modal-dialog-scrollable"
    style="--bs-modal-width: min(90vw, 800px);"
>
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">
                {{ _('Chess-Results.com upload') }}
            </h2>
        </div>
        <div class="modal-body">
            {% include 'chess_results_upload_results.html' %}

            <div class="text-center mt-3 mb-1">
                <button
                    type="button"
                    hx-post="{{ url_for('chess-results-upload', event_uniq_id=admin_event.uniq_id) }}"
                    hx-target="#upload-results"
                    hx-swap="outerHTML"
                    class="text-nowrap white btn btn-outline-primary"
                >
                    <i class="bi bi-cloud-arrow-up-fill pe-1"></i>
                    {{ _('Upload all tournaments') }}
                </button>
            </div>
        </div>

        <div class="modal-footer">
            <button
                type="button"
                class="btn btn-secondary text-nowrap"
                data-bs-dismiss="modal"
            >
                <i class="bi-x-circle-fill pe-1"></i>
                {{ _('Close') }}
            </button>
        </div>
    </div>
</div>

<script>requestRefresh()</script>
