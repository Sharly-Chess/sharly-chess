{% import '/admin/common/macros.j2' as admin_macros with context %}

<div id="change-documents-modal" class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">
                    {{ _('Replace document') }}
            </h2>
        </div>
        <div class="modal-body">
            <form
                id="modal-form"
                hx-patch="{{ url_for('change-documents-update', event_uniq_id=admin_event.uniq_id, tournament_id=admin_tournament.id) }}"
                hx-target="body"
                hx-indicator="#please-wait"
            >
                {% for document_name, document_url in data.items() %}
                    <div class="row gy-2 gx-3">
                        <div>
                            {{ admin_macros.text_input(
                                name=document_name,
                                label=_('Document URL:'),
                                data={document_name: document_url}, errors=errors
                            ) }}
                        </div>
                    </div>
                {% endfor %}
                <button
                        type="button"
                        class="btn btn-outline-primary text-nowrap mt-3"
                        hx-post="{{ url_for('add-document', event_uniq_id=admin_event.uniq_id, tournament_id=admin_tournament.id) }}"
                        hx-target="body"
                >
                    <i class="bi-plus-circle pe-1"></i>
                    {{ _('Add another document') }}
                </button>
            </form>
        </div>
        <div class="modal-footer">
            <button
                type="button"
                class="btn btn-secondary text-nowrap"
                data-bs-dismiss="modal"
            >
                <i class="bi-x-circle-fill pe-1"></i>
                {{ _('Cancel') }}
            </button>
            <span id="submit-button-container">
                <button
                    type="submit"
                    form="modal-form"
                    class="text-nowrap white btn btn-primary"
                >
                    <i class="bi-floppy-fill pe-1"></i>
                    {{ _('Save') }}
                </button>
            </span>
        </div>
    </div>
</div>
