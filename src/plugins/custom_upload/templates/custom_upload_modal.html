{% import '/common/macros.j2' as macros with context %}

<div class="modal-dialog modal-dialog-scrollable admin-event-edit-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">
                {{ _('Upload tournament documents to custom location') }}
            </h2>
        </div>
        <div class="modal-body">
            <!-- TODO: support multiple connections instead of only a default one -->
            <h3> {{ _('Connection') }}
                <span {{ macros.tooltip_attributes('', _('Edit connection')) }}>
                    <button
                        type="button"
                        class="btn btn-outline-primary btn-sm h-100 align-items-center"
                        hx-get="{{ url_for('custom-upload-event-configuration-modal', action='update', event_uniq_id=admin_event.uniq_id) }}"
                        hx-target="body"
                        hx-indicator="#please-wait"
                    >
                        <i class="bi bi-pencil-fill lh-1"></i>
                    </button>
                </span>
            </h3>
            <table
                class="table prominent table-sm w-100 bg-light mx-auto justify-content-center"
            >
                <thead>
                    <th>
                        {{ _('Tournament') }}
                    </th>
                    <th>
                        {{ _('Status') }}
                    </th>
                    <th>
                        {{ _('Documents') }}
                    </th>
                    <th class="text-center">
                        {{ _('Last upload') }}
                    </th>
                    <th class="text-center text-nowrap">
                        {{ _('Site') }}
                    </th>
                </thead>
                {% include 'custom_upload_results.html' %}
            </table>

            <div class="text-center mt-4 mb-1">
                <button
                    type="button"
                    hx-post="{{ url_for('custom-upload', event_uniq_id=admin_event.uniq_id) }}"
                    hx-target="#upload-results"
                    hx-swap="outerHTML"
                    class="text-nowrap white btn btn-outline-primary"
                    hx-on--before-request="$('#upload-results .status').addClass('invisible')"
                >
                    <i class="bi bi-cloud-arrow-up-fill pe-1"></i>
                    {{ _('Upload all tournaments') }}
                </button>
            </div>
        </div>

        <div class="modal-footer">
            <button
                type="button"
                class="btn btn-secondary text-nowrap"
                data-bs-dismiss="modal"
            >
                <i class="bi-x-circle-fill pe-1"></i>
                {{ _('Close') }}
            </button>
        </div>
    </div>
</div>
