<h4>{{ _('Chess960') }}</h4>
<div class="row gy-2 gx-3">
    <div class="col-12">
        <div class="form-check form-switch">
            <input
                type="checkbox"
                class="form-check-input"
                id="chess960-show-all-rounds"
                name="show_all_rounds"
                value="true"
                {% if data.get('show_all_rounds') %}checked{% endif %}
            />
            <label class="form-check-label" for="chess960-show-all-rounds">
                {{ _('Show every round (instead of only the current round)') }}
            </label>
        </div>
    </div>
    <div class="col-12">
        <div class="form-check form-switch">
            <input
                type="checkbox"
                class="form-check-input"
                id="chess960-fit-to-screen"
                name="fit_to_screen"
                value="true"
                {% if data.get('fit_to_screen') %}checked{% endif %}
            />
            <label class="form-check-label" for="chess960-fit-to-screen">
                {{ _('Fit all boards on the screen (otherwise scroll)') }}
            </label>
        </div>
    </div>
</div>
