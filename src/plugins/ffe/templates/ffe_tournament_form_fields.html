<input id="player-rating-type-hidden" type="hidden" name="player_rating_type" value="3">
<script>
    $(document).ready(function() {
        $('#player-rating-type').val('3').trigger('change');
        $('#player-rating-type').prop('disabled', true);

        const ratingTypeContainer = document.getElementById('player-rating-type-input-container');
        new bootstrap.Tooltip(ratingTypeContainer, {
            title: '{{ _('The FFE always uses the FIDE rating when available.') }}',
            placement: 'top',
        });
    });
</script>
<div id="ffe-connection-section" class="mt-4">
    <h4>
        {{ _('Connection French Chess Federation') }}
    </h4>
    {% include 'ffe_tournament_ffe_auth_fields.html' %}
</div>
<div id="ffe-team-connection-section" class="mt-4">
    <h4>
        {{ _('Connection French Chess Federation') }}
    </h4>
    {% include 'ffe_tournament_team_auth_fields.html' %}
</div>
<script>
    (function () {
        // A team event is sent through the site's team module; an
        // individual tournament uploads a Papi file, offered for the
        // systems listed here (those with a game-point score).
        const FFE_TRANSFER = {{ ffe_transfer_system_ids|tojson }};
        const TEAM_EVENT = {{ ffe_team_event|tojson }};
        // Competition id per rule set that names one: it fixes the choice.
        const RULE_SET_COMPETITIONS = {{ ffe_team_rule_set_competitions|tojson }};
        const DIVISION_HINTS = {{ ffe_team_division_hints|tojson }};
        function papiTransfer() {
            return FFE_TRANSFER.includes($('#pairing-system').val() || '');
        }
        function teamTransfer() {
            return TEAM_EVENT;
        }
        window.ffeTeamDivisionHint = function () {
            const hints = DIVISION_HINTS[$('#rule-set').val() || ''] || {};
            for (const key of Object.keys(hints)) {
                const [name, value] = key.split('=');
                const $input = $('[name="' + name + '"]');
                if ($input.length && ($input.val() || '') === value) {
                    return hints[key];
                }
            }
            return '';
        };
        function syncFfeConnection() {
            $('#ffe-connection-section').toggle(!teamTransfer() && papiTransfer());
            $('#ffe-team-connection-section').toggle(teamTransfer());
        }
        function refreshTeamLists() {
            syncFfeConnection();
            if (teamTransfer()) {
                htmx.trigger('#ffe-team-connection-section .team-auth-fields', 'ffe-team-refresh');
            }
        }
        $('#pairing-system').on('change', refreshTeamLists);
        $('#rule-set').on('change', refreshTeamLists);
        $('[data-rule-set-config] select').on('change', refreshTeamLists);
        syncFfeConnection();
    })();
</script>
