<tr id="players-table-empty-row">
    {% if not filtered_player_count %}
        <td colspan="100%" class="px-3 text-center">
            {% if is_search_active %}
                {{ _('No players') }}
                (<a
                    href=""
                    hx-get="{{ url_for('admin-event-players-clear-filters', event_uniq_id=admin_event.uniq_id) }}"
                    hx-target="body"
                    hx-indicator="#please-wait"
                >{{ _('clear filters') }}</a>).
            {% else %}
                {{ _('No players.') }}
            {% endif %}
        </td>
    {% endif %}
</tr>
