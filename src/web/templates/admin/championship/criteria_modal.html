{% import '/common/macros.j2' as macros with context %}

<div class="modal-dialog modal-dialog-scrollable" style="--bs-modal-width: min(90vw, 560px);">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">{{ _('Criteria list') }}</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Close') }}"></button>
        </div>
        <div class="modal-body">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
                <h4 class="mb-0">{{ category.name }}</h4>
                <button
                    class="btn btn-primary text-nowrap"
                    hx-get="{{ url_for('admin-championship-criterion-create-modal', championship_uniq_id=championship.uniq_id, category_id=category.id) }}"
                    hx-target="body"
                    hx-indicator="#please-wait"
                    {% if category.stored_criteria|length >= 3 %}disabled{% endif %}
                >
                    <i class="bi-plus-square-fill pe-1"></i>{{ _('Add') }}
                </button>
            </div>
            <div class="d-flex flex-column gap-2">
                {% if not category.stored_criteria %}
                    <div class="text-body-secondary">{{ _('No criteria.') }}</div>
                {% endif %}
                {% for criterion in category.stored_criteria %}
                    <div class="border border-secondary bg-body-tertiary">
                        <div class="p-2 d-flex align-items-center gap-3">
                            <span class="flex-grow-1">{{ criterion_labels[criterion.id] }}</span>
                            <div class="d-flex gap-2">
                                <button
                                    class="btn btn-sm btn-outline-primary"
                                    hx-get="{{ url_for('admin-championship-criterion-update-modal', championship_uniq_id=championship.uniq_id, category_id=category.id, criterion_id=criterion.id) }}"
                                    hx-target="body"
                                    hx-indicator="#please-wait"
                                    aria-label="{{ _('Edit') }}"
                                    {{ macros.tooltip_attributes('', _('Edit'), 'top') }}
                                ><i class="bi-pencil-fill"></i></button>
                                <button
                                    class="btn btn-sm btn-outline-danger"
                                    hx-delete="{{ url_for('admin-championship-criterion-delete', championship_uniq_id=championship.uniq_id, category_id=category.id, criterion_id=criterion.id) }}"
                                    hx-target="body"
                                    hx-indicator="#please-wait"
                                    aria-label="{{ _('Delete') }}"
                                    {{ macros.tooltip_attributes('warning', _('Delete'), 'top') }}
                                ><i class="bi-trash-fill"></i></button>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<script>requestRefresh()</script>
