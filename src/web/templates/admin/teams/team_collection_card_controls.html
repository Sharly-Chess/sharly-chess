{% for id, name, show, label, tooltip in [
    (
        'show-roster',
        'show_roster',
        show_roster,
        _('Rosters'),
        _('Show/hide the team rosters on the cards.'),
    ),
    (
        'show-lineup',
        'show_lineup',
        show_lineup,
        _('Lineups'),
        _('Show/hide the round lineups on the cards.'),
    ),
] %}
    <div
        class="form-check form-switch collection-details-toggle mb-0"
        {{ macros.tooltip_attributes('info', tooltip, 'top') }}
    >
        <input
            class="form-check-input"
            type="checkbox"
            id="{{ id }}"
            {% if show %}checked{% endif %}
            hx-get="{{ collection_url }}"
            hx-vals='{"{{ name }}": "{{ 'false' if show else 'true' }}"}'
            hx-target="body"
            hx-push-url="false"
            hx-indicator="#please-wait"
        />
        <label class="form-check-label" for="{{ id }}">{{ label }}</label>
    </div>
{% endfor %}
