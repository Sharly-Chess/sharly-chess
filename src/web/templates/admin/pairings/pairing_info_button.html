{% import '/common/macros.j2' as macros with context %}
{# How this round's pairings were arrived at: the score groups the engine
   worked from, and each player's opponents and colours so far. #}
<div
    {{ macros.tooltip_attributes(
        'info',
        pairings_generation_disabled_message
        or set_all_present_message
        or _('See the pairings information for the start of this round.'),
        'top',
    ) }}
>
    <button
        class="btn btn-outline-primary text-nowrap"
        hx-get="{{ url_for(
            'admin-pairings-info-modal',
            event_uniq_id=admin_event.uniq_id,
            tournament_id=admin_tournament.id,
            round=admin_round
        ) }}"
        hx-trigger="click"
        data-bs-toggle="modal"
        data-bs-target="#modal-wrapper"
        hx-target="body"
        hx-indicator="#please-wait"
        {% if pairings_generation_disabled_message %}
            disabled
        {% endif %}
    >
        <i class="bi-info-circle pe-1"></i>
        {{ _('Info') }}
    </button>
</div>
