<span
    id="print-button"
    {% if swap_oob %}
        hx-swap-oob="true"
    {% endif %}
    class="sidebar-tooltip" {{ macros.tooltip_attributes('info', pgettext('with shortcut indication', 'Documents'), 'right') }}
>
    <button
        class="nav-link text-start d-flex align-items-center"
        {{ components.modal_trigger_attrs(url_for('documents-modal', event_uniq_id=admin_event.uniq_id)) }}
        hx-trigger="click, {{ pgettext('keyboard shortcut for the documents tab', 'SC_D') }} from:body"
    >
        <i class="bi bi-file-earmark-text"></i>
        <span class="expanded-only">{{ pgettext('with shortcut indication', 'Documents')|safe }}</span>
    </button>
</span>
