<div class="col-12">
    <div class="d-flex gap-2 align-items-center">
        <div class="flex-grow-1">
            {{ admin_macros.select_input(
                name=option.id,
                label=_('Template:'),
                select_options={},
                tooltip_select=true,
                data=data, errors=errors
            ) }}
        </div>
        {% if client.can_manage_application_settings %}
            <div
                {{ macros.tooltip_attributes(
                    'info', _('Manage the place card templates, which are available for all events.'), 'top'
                ) }}
            >
                <button
                    id="place-card-templates-button"
                    type="button"
                    class="btn btn-sm btn-outline-primary text-nowrap"
                    hx-get="{{ url_for('place-card-templates') }}"
                    hx-target="body"
                    hx-push-url="true"
                    hx-indicator="#please-wait"
                    data-bs-dismiss="modal"
                >
                    <i class="bi bi-person-vcard pe-1"></i>
                    {{ _('Templates') }}
                </button>
            </div>
        {% endif %}
    </div>
</div>

<script>
    $(document).ready(function() {
        const placeCardTypeSelect = $('.modal #place-card-type');
        const placeCardTemplateSelect = $('.modal #{{option.id}}');
        const placeCardTemplatesPerType = {{ option.place_card_templates_per_type | tojson }};

        function updatePlaceCardTemplates() {
            const placeCardTypeId = placeCardTypeSelect.val();
            const placeCardTemplates = placeCardTemplatesPerType[placeCardTypeId] || [];

            placeCardTemplateSelect.empty();

            // Add templates
            placeCardTemplates.forEach(placeCardTemplate => {
                placeCardTemplateSelect.append(
                    $('<option>', {
                        value: placeCardTemplate.id,
                        text: placeCardTemplate.name,
                        title: placeCardTemplate.tooltip,
                    })
            );

            placeCardTemplateSelect.prop('disabled', false);
        });
        }

        placeCardTypeSelect.on('change', updatePlaceCardTemplates);
        updatePlaceCardTemplates();
    })
</script>
