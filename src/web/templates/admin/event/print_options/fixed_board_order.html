{% if option.applies %}
    <div class="col-12">
        {{ admin_macros.select_input(
            name=option.id,
            label=_('Fixed board ordering:'),
            select_options=option.order_options,
            data=data, errors=errors
        ) }}
    </div>
    <script>
        (() => {
            const $modal = $('.modal');
            function toggleFixedBoardOrder() {
                const style = $modal.find('#pairing-style').val();
                const visible = printOptionContainers().includes('{{ option.container_id }}')
                    && style === '{{ option.boards_pairing_style_id }}';
                // Delay so this runs after the modal's own document-change handler.
                setTimeout(() => {
                    $('#{{ option.container_id }}').css('display', visible ? 'block' : 'none');
                }, 0);
            }
            $modal.find('#document, #tournament').on('change', toggleFixedBoardOrder);
            $modal.find('#pairing-style').on('change', toggleFixedBoardOrder);
            toggleFixedBoardOrder();
        })();
    </script>
{% endif %}
