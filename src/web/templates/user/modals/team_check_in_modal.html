<div
    class="modal-dialog modal-dialog-centered result-entry-modal check-in-modal"
    hx-disabled-elt=".check-in-modal button"
>
    <div class="modal-content">
        <div class="result-modal-header">
            <div class="result-modal-heading">
                <div class="result-modal-title">{{ _('Check-in') }}</div>
                <div class="result-modal-subtitle">{{ tournament.name }}</div>
            </div>
        </div>
        <div class="check-in-modal-entrant {% if team.check_in %}checked-in{% endif %}">
            <i class="check-in-mark {% if team.check_in %}bi-check-circle-fill{% else %}bi-circle{% endif %}"></i>
            <div class="check-in-modal-identity">
                <div class="check-in-modal-name fw-bold">{{ team.name }}</div>
                <div class="check-in-modal-details">
                    {{ ngettext('%(count)d player', '%(count)d players', team.players|length, count=team.players|length) }} ·
                    {% if team.check_in %}{{ _('Checked in') }}{% else %}{{ _('Not checked in yet') }}{% endif %}
                </div>
            </div>
        </div>
        <div class="result-modal-footer">
            <button
                type="button"
                data-bs-dismiss="modal"
                class="result-cancel-button ms-0"
            >{{ _('Cancel') }}</button>
            <button
                type="button"
                class="check-in-modal-button {% if team.check_in %}undo{% endif %}"
                hx-patch="{{ url_for('user-team-toggle-check-in', event_uniq_id=user_event.uniq_id, screen_uniq_id=screen.uniq_id, tournament_id=tournament.id, team_id=team.id) }}"
                hx-target="body"
                hx-indicator="#please-wait"
            >{% if team.check_in %}{{ pgettext('check-in button', 'Cancel the check-in') }}{% else %}{{ pgettext('check-in button', 'Check in') }}{% endif %}</button>
        </div>
    </div>
</div>
